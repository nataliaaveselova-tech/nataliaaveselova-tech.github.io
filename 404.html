<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <!-- Сюда можно подключить ваш основной CSS, если хотите -->
    <!-- <link rel="stylesheet" href="css/style.css"> -->
    
    <!-- Встроенные стили, чтобы страница выглядела красиво, даже если внешний CSS не загрузится -->
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f9f9f9; 
            color: #333; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            text-align: center;
        }
        .container { 
            max-width: 500px; 
            background: #fff; 
            padding: 50px 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            margin: 20px;
        }
        h1 { 
            font-size: 100px; 
            margin: 0; 
            color: #0366d6; 
            line-height: 1;
        }
        h2 { 
            font-size: 24px; 
            margin: 10px 0 20px; 
            font-weight: 600;
        }
        p { 
            color: #666; 
            font-size: 16px; 
            line-height: 1.5; 
            margin-bottom: 30px;
        }
        .buttons { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            align-items: center;
        }
        a { 
            display: inline-block; 
            padding: 12px 24px; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: 500; 
            font-size: 16px; 
            transition: background-color 0.2s;
            width: 80%;
            box-sizing: border-box;
        }
        .btn-primary { 
            background-color: #0366d6; 
            color: #fff; 
        }
        .btn-primary:hover { 
            background-color: #0250a8; 
        }
        .btn-secondary { 
            background-color: #f1f8ff; 
            color: #0366d6; 
            border: 1px solid #c8e1ff;
        }
        .btn-secondary:hover { 
            background-color: #e1f0ff; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>Ой! Кажется, вы забрели не туда</h2>
        <p>Страница, которую вы ищете, не существует, была перемещена или удалена. Но вы всегда можете вернуться к нашим материалам.</p>
        
        <div class="buttons">
            <a href="index.html" class="btn-primary">← Вернуться на главную</a>
            <a href="projects.html" class="btn-secondary">Перейти в каталог статей</a>
        </div>
    </div>

</body>
</html>
